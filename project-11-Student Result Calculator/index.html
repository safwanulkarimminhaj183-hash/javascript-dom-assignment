<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-container">
        <h2>Student Result Calculator</h2>
        
        
        <div class="input-group">
            <label for="bangla">Bangla Marks:</label>
            <input type="number" id="bangla" placeholder="Enter Bangla marks" min="0" max="100">
        </div>

        <div class="input-group">
            <label for="english">English Marks:</label>
            <input type="number" id="english" placeholder="Enter English marks" min="0" max="100">
        </div>

        <div class="input-group">
            <label for="math">Math Marks:</label>
            <input type="number" id="math" placeholder="Enter Math marks" min="0" max="100">
        </div>

        <button id="calculate-btn">Calculate Result</button>

        
        <div id="output-result" class="output-box hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
