<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-box">
        <h2>Simple Calculator</h2>
        
        <div class="input-container">
            <input type="number" id="num1" placeholder="Enter first number">
            <input type="number" id="num2" placeholder="Enter second number">
        </div>
        
        <div class="button-grid">
            <button id="add-btn" class="btn">Add</button>
            <button id="subtract-btn" class="btn">Subtract</button>
            <button id="multiply-btn" class="btn">Multiply</button>
            <button id="divide-btn" class="btn">Divide</button>
        </div>
        
        <div class="result-screen">
            <span>Result: </span>
            <span id="result-value">0</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
