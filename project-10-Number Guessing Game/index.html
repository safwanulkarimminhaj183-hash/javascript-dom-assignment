<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h2>Number Guessing Game</h2>
        <p class="instruction">Guess a number between 1 and 100</p>
        
        
        <input type="number" id="guess-input" placeholder="Enter your guess" min="1" max="100">
        
        <button id="guess-btn">Guess</button>
        <button id="restart-btn" class="hidden">Play Again</button>
        
        
        <div id="output-message" class="message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
