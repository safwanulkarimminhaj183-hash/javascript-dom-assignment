<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character & Word Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="counter-container">
        <h2>Character Counter</h2>
        
        <textarea id="text-input" placeholder="Start typing here..."></textarea>
        
        <div class="result-panel">
            <div class="counter-box">
                <span class="count-number" id="char-count">0</span>
                <span class="count-label">Characters</span>
            </div>
            <div class="counter-box">
                <span class="count-number" id="word-count">0</span>
                <span class="count-label">Words</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
